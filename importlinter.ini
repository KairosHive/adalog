[importlinter]
root_packages =
    adalog
include_external_packages = True

[importlinter:contract:goofi-free-spine]
name = Recording spine, schema, adapters, store, convert and codec are goofi/torch/iceoryx2-free
type = forbidden
source_modules =
    adalog.core
    adalog.schema
    adalog.adapters
    adalog.store
    adalog.convert
    adalog.bridge_codec
forbidden_modules =
    goofi
    torch
    iceoryx2

[importlinter:contract:layers]
name = Layered architecture (core <- adapters <- sense)
type = layers
layers =
    sense
    adapters
    core
containers =
    adalog
