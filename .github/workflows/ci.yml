name: ci

on:
  push:
    branches: [main, "rework/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync (core + dev)
        run: uv sync --extra dev
      - name: Import-guard (goofi-free spine + layers)
        run: uv run lint-imports --config importlinter.ini
      - name: Tests (excluding browser e2e)
        run: uv run pytest -q -m "not e2e"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
