name: ci

on:
  push:
    branches: [main, "rework/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync (core + dev)
        run: uv sync --extra dev
      - name: Import-guard (goofi-free spine + layers)
        run: uv run lint-imports --config importlinter.ini
      - name: Tests
        run: uv run pytest -q
