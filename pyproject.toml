[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=68"]

[project]
name = "adalog"
version = "1.0.0a0"
description = "Self-contained multimodal data-recording platform (adalog-sense core recorder)"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
keywords = ["multimodal", "recording", "eeg", "lsl", "dataset", "neurophenomenology"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy<2",
  "pyarrow>=14",
  "msgpack>=1.0",
  "pydantic>=2.5",
  "blake3>=0.4",
  "platformdirs>=4",
  "keyring>=24",
  "aiohttp>=3.9",
  "requests>=2.31",
]

[project.optional-dependencies]
# Device acquisition backends (native, goofi-free). Imported lazily inside adapters.
devices = [
  "pylsl>=1.16",
  "pyserial>=3.5",
  "sounddevice>=0.4",
  "soundfile>=0.12",
  "mido>=1.3",
  "python-rtmidi>=1.5",
  "oscpy>=0.6",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.2",
  "import-linter>=2.0",
]
# Spec 3 (goofi co-hosting) — intentionally empty placeholder; populated later.
goofi = []

[project.scripts]
adalog-sense = "adalog.sense.cli:main"
adalog-convert = "adalog.convert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adalog*"]

[tool.setuptools.package-data]
adalog = ["assets/*", "sense/web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 60
filterwarnings = [
  "ignore::DeprecationWarning",
  # benign oscpy listener-thread EBADF on server teardown (see tests/sense/test_osc_capture.py)
  'ignore:.*_run_listener:pytest.PytestUnhandledThreadExceptionWarning',
]
markers = ["e2e: browser end-to-end tests (need a built frontend + Playwright chromium)"]

[tool.black]
line-length = 120
